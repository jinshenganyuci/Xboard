

[program:external-subscriptions-sync]
command=/bin/sh /usr/local/bin/xboard-external-subscriptions-worker
directory=/www
autostart=%(ENV_ENABLE_EXTERNAL_SUBSCRIPTIONS_SYNC)s
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
numprocs=1
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=600

[program:external-subscriptions-health]
process_name=%(program_name)s_%(process_num)02d
command=/bin/sh /usr/local/bin/xboard-external-subscriptions-worker health %(process_num)s
directory=/www
autostart=%(ENV_ENABLE_EXTERNAL_SUBSCRIPTIONS_HEALTH)s
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
numprocs=2
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=610
