# Disposable upgrade fixture. Run only through run-node-dns-upgrade.sh.
# Every persistent path is beside this Compose file; never use production data.
services:
  xboard:
    image: ${XBOARD_DNS_TEST_IMAGE:?Set the image being tested}
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    networks: [isolated]
    environment:
      ENABLE_SQLITE: 'true'
      ENABLE_REDIS: 'true'
      RESOURCE_PROFILE: minimal
      ENABLE_HORIZON: 'false'
      ENABLE_WS_SERVER: 'false'
      ENABLE_EXTERNAL_SUBSCRIPTIONS_SYNC: 'false'
      ENABLE_EXTERNAL_SUBSCRIPTIONS_HEALTH: 'false'
      docker: 'true'
      ADMIN_ACCOUNT: dns-upgrade-installer@example.invalid
    volumes:
      - ./.env:/www/.env
      - ./data:/www/.docker/.data
      - ./redis:/data
      - ./theme:/www/theme
      - ./storage:/www/storage
      - ./state:/upgrade-state
      - ./scripts:/upgrade-scripts:ro
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        if ! grep -qE '^INSTALLED=(1|true)$$' /www/.env; then
          test ! -s /www/.docker/.data/database.sqlite
          php /www/artisan xboard:install --no-interaction >/upgrade-state/install.log 2>&1
          grep -qE '^INSTALLED=(1|true)$$' /www/.env
        fi
        exec /entrypoint.sh /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
networks:
  isolated:
    internal: true
